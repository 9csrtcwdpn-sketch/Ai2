<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>AI</title>
<style>
:root{
  --bg:#ffffff;--bg2:#f7f7f8;--fg:#111827;--fg2:#4b5563;--mute:#9ca3af;
  --line:#e5e7eb;--card:#f3f4f6;--user-bg:#f3f4f6;--user-fg:#111827;
  --acc:#111827;--accfg:#ffffff;--blue:#2563eb;--bad:#dc2626;--bad-bg:#fef2f2;--bad-line:#fecaca;--ok:#16a34a;
  --shadow:0 2px 12px rgba(0,0,0,.06);--code-bg:#f4f5f7
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0d0e11;--bg2:#15171c;--fg:#f3f4f6;--fg2:#9ca3af;--mute:#6b7280;
  --line:#242730;--card:#1b1e25;--user-bg:#222631;--user-fg:#f3f4f6;
  --acc:#f3f4f6;--accfg:#111827;--blue:#60a5fa;--bad:#f87171;--bad-bg:#2a1517;--bad-line:#5c2327;--ok:#4ade80;
  --shadow:0 2px 14px rgba(0,0,0,.35);--code-bg:#16181e
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--bg);color:var(--fg);
  font:15.5px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top)
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* 顶部导航栏 */
header{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-bottom:1px solid var(--line);
  background:var(--bg);flex:none;z-index:2
}
.ic{
  width:36px;height:36px;border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--fg2);transition:background .15s;flex:none
}
.ic:active{background:var(--card)}
.ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#pill{
  flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;
  padding:6px 12px;border-radius:12px;font-weight:600;font-size:15px;
  transition:background .15s
}
#pill:active{background:var(--card)}
#pill .mn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pill .ch-tag{font-size:12px;font-weight:400;color:var(--mute);flex:none;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pill .chev{color:var(--mute);font-size:11px;flex:none}

/* 消息列表 */
#list{
  flex:1;overflow-y:auto;padding:16px 16px 20px;
  -webkit-overflow-scrolling:touch;scroll-behavior:auto
}
.empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;color:var(--mute);gap:10px;padding-bottom:10vh
}
.empty-logo{
  width:48px;height:48px;border-radius:16px;background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--fg)
}
.empty h2{margin:0;font-size:18px;font-weight:600;color:var(--fg)}
.empty p{margin:0;font-size:14px;color:var(--mute)}

/* 用户气泡 */
.u-wrap{display:flex;justify-content:flex-end;margin:0 0 18px}
.u{
  max-width:84%;background:var(--user-bg);color:var(--user-fg);
  padding:10px 15px;border-radius:20px 20px 6px 20px;
  white-space:pre-wrap;word-break:break-word;font-size:15.5px;line-height:1.55
}
.u img{display:block;max-width:62vw;max-height:220px;border-radius:12px;margin-bottom:6px}
.fc{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--bg);border:1px solid var(--line);
  padding:4px 9px;border-radius:8px;font-size:12.5px;color:var(--fg2);margin:0 4px 6px 0
}

/* AI 消息 */
.a{margin:0 0 22px;max-width:100%}
.a-head{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.a-av{
  width:22px;height:22px;border-radius:7px;background:var(--acc);color:var(--accfg);
  font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none
}
.a-name{font-size:13px;font-weight:600;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 思考折叠条（默认折叠） */
.th{margin:2px 0 8px}
.th-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card);color:var(--fg2);
  padding:6px 11px;border-radius:10px;font-size:13px;font-weight:500;
  max-width:100%;transition:background .15s
}
.th-btn:active{opacity:.75}
.th-dot{
  width:7px;height:7px;border-radius:50%;background:var(--blue);flex:none;
  animation:pulse 1.1s ease-in-out infinite
}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
.th-arr{font-size:11px;color:var(--mute);transition:transform .15s}
.th-btn.open .th-arr{transform:rotate(90deg)}
.tk{
  margin:8px 0 4px;padding:10px 12px;
  background:var(--bg2);border-left:2.5px solid var(--line);border-radius:0 10px 10px 0;
  color:var(--fg2);font-size:13.5px;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;
  max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch
}

/* 正文 Markdown */
.t{word-break:break-word;font-size:15.5px;line-height:1.7;color:var(--fg)}
.t p{margin:0 0 10px}.t p:last-child{margin-bottom:0}
.t h1,.t h2,.t h3,.t h4{margin:14px 0 6px;font-weight:600;line-height:1.35}
.t h1{font-size:19px}.t h2{font-size:17px}.t h3{font-size:16px}
.t ul,.t ol{margin:6px 0 10px;padding-left:20px}
.t li{margin:3px 0}
.t blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--line);color:var(--fg2)}
.t code{font:13.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--code-bg);padding:1.5px 5px;border-radius:5px}
.code-wrap{margin:10px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code-bg)}
.code-bar{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute)}
.code-bar button{font-size:12px;color:var(--fg2);padding:2px 6px;border-radius:6px}
.code-bar button:active{background:var(--line)}
.t pre{margin:0;padding:10px 12px;overflow-x:auto;font-size:13px;line-height:1.55}
.t pre code{padding:0;background:none;font-size:13px}
.typing{display:inline-flex;gap:4px;padding:6px 2px;align-items:center}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:pulse 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}

/* 友好错误卡片 */
.err-box{
  margin-top:4px;padding:10px 12px;border-radius:12px;
  background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad);
  font-size:13.5px;line-height:1.5
}
.err-box .err-sub{font-size:12px;opacity:.8;margin-top:3px;word-break:break-all}
.cut{color:var(--bad);font-size:12.5px;margin-top:6px}

/* 消息底部操作栏 */
.acts{display:flex;align-items:center;gap:4px;margin-top:8px;flex-wrap:wrap}
.act{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 9px;border-radius:8px;font-size:12.5px;color:var(--mute);
  transition:background .15s,color .15s
}
.act:active{background:var(--card);color:var(--fg)}
.det{margin-top:8px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.det div{display:flex;justify-content:space-between;gap:14px;padding:2.5px 0}
.det span:first-child{color:var(--mute);flex:none}
.det span:last-child{text-align:right;word-break:break-all;color:var(--fg2)}
.ok{color:var(--ok)!important}.diff{color:var(--bad)!important}

/* 现代 AI 对话输入框（底部悬浮胶囊） */
.composer-wrap{
  flex:none;padding:8px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--bg)
}
#atts{display:none;gap:8px;padding:0 2px 8px;overflow-x:auto}
.ch{position:relative;flex:none}
.ch img{width:54px;height:54px;object-fit:cover;border-radius:12px;display:block;border:1px solid var(--line)}
.ch span{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:12.5px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg2)}
.ch button{position:absolute;top:-5px;right:-5px;width:19px;height:19px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:10px;display:flex;align-items:center;justify-content:center}
.composer{
  background:var(--bg2);border:1px solid var(--line);border-radius:24px;
  padding:8px 10px 8px 14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:4px;transition:border-color .15s
}
.composer:focus-within{border-color:var(--mute)}
#ta{
  width:100%;resize:none;max-height:132px;border:0;background:transparent;color:var(--fg);
  padding:4px 2px;font-family:inherit;font-size:16px;line-height:1.45;outline:none
}
#ta::placeholder{color:var(--mute)}
.c-bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.c-left{display:flex;align-items:center;gap:4px}
.c-btn{
  width:32px;height:32px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;color:var(--fg2)
}
.c-btn:active{background:var(--card)}
.c-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#send{
  width:34px;height:34px;border-radius:50%;
  background:var(--acc);color:var(--accfg);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;flex:none;transition:opacity .15s,transform .1s
}
#send:active{transform:scale(.94)}
#send.stop{background:var(--fg);color:var(--bg)}

/* 底部抽屉 */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:10;backdrop-filter:blur(2px)}
.sheet.on{display:flex}
.panel{background:var(--bg);width:100%;max-height:84%;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom))}
.panel-bar{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.panel h3{margin:0 0 12px;font-size:16px;font-weight:600}
.cv{display:flex;align-items:center;gap:4px}.cv .opt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.x{color:var(--mute);padding:8px 10px;font-size:14px}
.grp{color:var(--mute);font-size:12.5px;font-weight:600;margin:14px 0 4px;padding:0 4px}
.opt{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:12px;font-size:15px}
.opt.on{background:var(--card);font-weight:600}.opt.on::after{content:"✓";float:right;color:var(--blue)}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:12px}
.card label{display:block;font-size:12.5px;color:var(--fg2);margin:9px 0 4px;font-weight:500}
.card label:first-child{margin-top:0}
.card input,.card select,.card textarea{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:9px 11px;font-family:inherit;font-size:16px;max-height:none;outline:none}
.card textarea{min-height:84px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.row{display:flex;gap:10px;margin-top:12px}
.btn{padding:9px 15px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:500}
.btn.p{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.btn.d{color:var(--bad)}
#toast{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 58px);transform:translateX(-50%);
  background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:88%;text-align:center;box-shadow:var(--shadow)
}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <button class="ic" id="hist" title="对话列表" aria-label="对话列表">
    <svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="15" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
  </button>
  <button id="pill"></button>
  <button class="ic" id="new" title="新对话" aria-label="新对话">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="ic" id="set" title="设置" aria-label="设置">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<div id="list"></div>

<div class="composer-wrap">
  <div id="atts"></div>
  <div class="composer">
    <textarea id="ta" rows="1" placeholder="问点什么…"></textarea>
    <div class="c-bar">
      <div class="c-left">
        <button class="c-btn" id="clip" title="添加图片或文件" aria-label="添加图片或文件">
          <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
      </div>
      <button id="send" aria-label="发送">↑</button>
    </div>
  </div>
</div>

<input type="file" id="file" multiple hidden accept="image/*,application/pdf,.pdf,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.log,.yaml,.yml,.java,.c,.cpp,.go,.rs,.sh,.sql,.ini,.toml">

<div class="sheet" id="sm"><div class="panel" id="pm"></div></div>
<div class="sheet" id="ss"><div class="panel" id="ps"></div></div>
<div class="sheet" id="sh"><div class="panel" id="ph"></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}};
const BASE={openai:'https://api.openai.com/v1',deepseek:'https://api.deepseek.com/v1',anthropic:'https://api.anthropic.com',gemini:'https://generativelanguage.googleapis.com'};
const TYPES={openai:'OpenAI 兼容（大多数服务商）',deepseek:'DeepSeek',anthropic:'Anthropic Claude',gemini:'Google Gemini'};
const DEFAULT_MODELS={deepseek:['deepseek-chat','deepseek-reasoner']};
let channels=ls.get('ch',[]),sel=ls.get('sel',null),busy=false,convs=ls.get('convs',null),cid=ls.get('cid',null),msgs=[];
const packConvs=(keepAttText=true,maxMsgs=60)=>convs.map(c=>({id:c.id,title:c.title,ts:c.ts,msgs:c.msgs.slice(-maxMsgs).map(m=>{const{streaming,t0,...r}=m;if(r.atts)r.atts=r.atts.map(a=>keepAttText?{kind:a.kind,name:a.name,text:a.text}:{kind:a.kind,name:a.name});return r})}));
const save=()=>{
  ls.set('ch',channels);ls.set('sel',sel);ls.set('cid',cid);
  if(ls.set('convs',packConvs(true,60)))return;
  if(ls.set('convs',packConvs(false,60))){toast('本地空间不足，已省略历史文本附件');return}
  if(ls.set('convs',packConvs(false,20))){toast('本地空间不足，已精简旧对话缓存');return}
  toast('本地存储已满，建议删除部分旧对话')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const newConv=()=>({id:uid(),title:'新对话',msgs:[],ts:Date.now()});
if(!convs){convs=[];const old=ls.get('msgs',[]);if(old.length){const c=newConv();c.msgs=old;c.title=(old.find(m=>m.role==='user')?.text||'之前的对话').slice(0,24);convs.push(c)}}
convs.forEach(c=>c.msgs.forEach(m=>{delete m.streaming;delete m.t0;if(typeof m.text!=='string')m.text='';if(m.role==='assistant'&&!m.text&&!m.think){m.err=true;m.text='上次生成未完成'}}));
{let c=convs.find(c=>c.id===cid)||convs[0];if(!c){c=newConv();convs.push(c)}cid=c.id;msgs=c.msgs}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}

/* ---- Markdown 渲染 ---- */
let codeStore=[];
function inlineMd(s){
  return s.split(/(`[^`\n]+`)/g).map((q,j)=>j%2
    ?'<code>'+esc(q.slice(1,-1))+'</code>'
    :esc(q).replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>')
  ).join('')}
function md(s){
  const parts=String(s).split(/(```[^\n]*\n?[\s\S]*?(?:```|$))/g);
  return parts.map((p,i)=>{
    if(i%2){
      const m=p.match(/^```([^\n]*)\n?([\s\S]*?)(?:```)?$/);
      const lang=(m?.[1]||'').trim(),code=(m?.[2]||'').replace(/\n$/,'');
      const idx=codeStore.push(code)-1;
      return'<div class="code-wrap"><div class="code-bar"><span>'+esc(lang||'代码')+'</span><button data-code="'+idx+'">复制代码</button></div><pre><code>'+esc(code)+'</code></pre></div>';
    }
    const lines=p.split('\n');let out='',inUl=false,inOl=false;
    const closeLists=()=>{if(inUl){out+='</ul>';inUl=false}if(inOl){out+='</ol>';inOl=false}};
    for(const raw of lines){
      const h=raw.match(/^(#{1,4})\s+(.+)$/);
      if(h){closeLists();out+='<h'+h[1].length+'>'+inlineMd(h[2])+'</h'+h[1].length+'>';continue}
      const ul=raw.match(/^\s*[-*•]\s+(.+)$/);
      if(ul){if(inOl){out+='</ol>';inOl=false}if(!inUl){out+='<ul>';inUl=true}out+='<li>'+inlineMd(ul[1])+'</li>';continue}
      const ol=raw.match(/^\s*\d+\.\s+(.+)$/);
      if(ol){if(inUl){out+='</ul>';inUl=false}if(!inOl){out+='<ol>';inOl=true}out+='<li>'+inlineMd(ol[1])+'</li>';continue}
      const bq=raw.match(/^>\s?(.*)$/);
      if(bq){closeLists();out+='<blockquote>'+inlineMd(bq[1])+'</blockquote>';continue}
      closeLists();
      if(raw.trim())out+='<p>'+inlineMd(raw)+'</p>';
    }
    closeLists();
    return out;
  }).join('')}
const cur=()=>{const c=channels.find(c=>c.id===sel?.ch);return c&&sel.m?{c,m:sel.m}:null};

/* ---- 附件 ---- */
let att=[],ctl=null;
const attHtml=m=>(m.atts||[]).map(a=>{
  if(a.kind==='image'&&a.data)return'<img src="'+a.data+'">';
  const expired=(a.kind==='image'||a.kind==='pdf')&&!a.data;
  return'<div class="fc">'+(a.kind==='image'?'🖼 ':'📄 ')+esc(a.name)+(expired?'（已释放）':'')+'</div>'}).join('');

function clean(src){
  const out=[];
  for(let i=0;i<src.length;i++){
    const m=src[i];
    if(m.err||m.streaming)continue;
    if(m.role==='user'){
      const next=src[i+1];
      if(next&&next.role==='assistant'&&next.err&&i<src.length-1)continue;
    }
    const txt=typeof m.text==='string'?m.text:'';
    if(!txt.trim()&&!(m.atts||[]).length)continue;
    const l=out[out.length-1];
    if(l&&l.role===m.role){
      if(m.role==='user'&&l.text.trim()&&l.text.trim()===txt.trim()&&!(m.atts&&m.atts.length))continue;
      l.text=(l.text&&txt?l.text+'\n\n':l.text)+txt;
      l.atts=[...(l.atts||[]),...(m.atts||[])]}
    else out.push({role:m.role,text:txt,atts:m.atts?[...m.atts]:undefined})}
  while(out.length&&out[0].role!=='user')out.shift();

async function runAssist(hist,s){

  msgs.push(m);save();render(true);

    const r=await call(s.c,s.m,hist,(t,k)=>{
      if(k&&!t&&!m.thinkStart)m.thinkStart=Date.now();
      if(t&&m.thinkStart&&!m.thinkSec)m.thinkSec=Math.max(1,Math.round((Date.now()-m.thinkStart)/1000));
      m.text=t;m.think=k;soft();
    });
    if(m.thinkStart&&!m.thinkSec)m.thinkSec=Math.max(1,Math.round((Date.now()-m.thinkStart)/1000));
    delete m.t0;delete m.thinkStart;

  busy=false;$('#send').textContent='↑';$('#send').classList.remove('stop');save();render()
}

  if(v){const c=convs.find(x=>x.id===v.dataset.v);if(c){cid=c.id;msgs=c.msgs;save();render(true)}$('#sh').classList.remove('on');return}
  if(d){const c=convs.find(x=>x.id===d.dataset.d);if(!c||!confirm('删除「'+c.title+'」？'))return;convs=convs.filter(x=>x!==c);if(!convs.length)convs.push(newConv());if(c.id===cid){const n=[...convs].sort((a,b)=>b.ts-a.ts)[0];cid=n.id;msgs=n.msgs}save();render(true);openHist()}};
$('#hist').onclick=openHist;
$('#sh').onclick=e=>{if(e.target.id==='sh')e.target.classList.remove('on')};

/* ---- 模型选择 ---- */
function openModels(){
  const P=$('#pm');
  P.innerHTML='<div class="panel-bar"></div><h3>选择模型</h3>'+(channels.some(c=>c.models.length)?channels.filter(c=>c.models.length).map(c=>'<div class="grp">'+esc(c.name)+'</div>'+c.models.map(m=>'<button class="opt'+(sel&&sel.ch===c.id&&sel.m===m?' on':'')+'" data-c="'+c.id+'" data-m="'+esc(m)+'">'+esc(m)+'</button>').join('')).join(''):'<div style="text-align:center;color:var(--mute);padding:32px 0">还没有可选的模型，点右上角设置添加接口</div>');
  $('#sm').classList.add('on')}
$('#pm').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;sel={ch:b.dataset.c,m:b.dataset.m};save();$('#sm').classList.remove('on');render();toast('已切换：'+sel.m)};
$('#sm').onclick=e=>{if(e.target.id==='sm')e.target.classList.remove('on')};
$('#pill').onclick=openModels;

/* ---- 设置 ---- */
function openSet(){
  const P=$('#ps');
  P.innerHTML='<div class="panel-bar"></div><h3>接口设置</h3>'+channels.map(c=>'<div class="card" data-id="'+c.id+'"><label>名称</label><input data-k="name" value="'+esc(c.name)+'"><label>协议</label><select data-k="type">'+Object.entries(TYPES).map(([k,v])=>'<option value="'+k+'"'+(c.type===k?' selected':'')+'>'+v+'</option>').join('')+'</select><label>接口地址</label><input data-k="base" value="'+esc(c.base)+'" autocapitalize="off" autocorrect="off"><label>API Key</label><input data-k="key" type="password" value="'+esc(c.key)+'" autocapitalize="off" autocorrect="off"><label>模型（每行一个，可手动添加）</label><textarea data-k="models" autocapitalize="off" autocorrect="off">'+esc(c.models.join('\n'))+'</textarea><div class="row"><button class="btn p" data-a="fetch">获取模型列表</button><button class="btn d" data-a="del">删除</button></div></div>').join('')+'<div class="row"><button class="btn p" data-a="add">添加接口</button><button class="btn" data-a="close">完成</button></div>';
  $('#ss').classList.add('on')}
function syncField(el){
  const k=el.dataset.k,card=el.closest('.card');if(!k||!card)return;
  const c=channels.find(x=>x.id===card.dataset.id);if(!c)return;
  if(k==='models'){c.models=el.value.split('\n').map(s=>s.trim()).filter(Boolean);if(sel?.ch===c.id&&!c.models.includes(sel.m))sel=null}
  else if(k==='type'){
    const old=c.type;c.type=el.value;
    if(!c.base||c.base===BASE[old])c.base=BASE[c.type];
    if(!c.models.length&&DEFAULT_MODELS[c.type])c.models=[...DEFAULT_MODELS[c.type]];
    save();openSet();return}
  else c[k]=el.value.trim();
  save();render()}
$('#ps').oninput=e=>{if(e.target.tagName!=='SELECT')syncField(e.target)};
$('#ps').onchange=e=>syncField(e.target);
$('#ps').onclick=async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='close'){$('#ss').classList.remove('on');render();return}
  if(a==='add'){channels.push({id:uid(),name:'新接口',type:'openai',base:BASE.openai,key:'',models:[]});save();openSet();return}
  const c=channels.find(x=>x.id===b.closest('.card').dataset.id);if(!c)return;
  if(a==='del'){if(!confirm('删除「'+c.name+'」？'))return;channels=channels.filter(x=>x!==c);if(sel?.ch===c.id)sel=null;save();openSet();return}
  if(a==='fetch'){
    if(!c.key&&c.type!=='openai'){toast('先填 API Key');return}
    if(b.disabled)return;
    b.disabled=true;b.textContent='获取中…';
    try{const ms=await listModels(c);if(!channels.includes(c))return;c.models=ms;if(sel?.ch===c.id&&!c.models.includes(sel.m))sel=null;save();toast('获取到 '+ms.length+' 个模型');const t=document.querySelector('.card[data-id="'+c.id+'"] [data-k=models]');if(t)t.value=ms.join('\n');render()}catch(err){toast(err.message.slice(0,80))}
    b.disabled=false;b.textContent='获取模型列表'}};
$('#set').onclick=openSet;
$('#ss').onclick=e=>{if(e.target.id==='ss'){e.target.classList.remove('on');render()}};

render();if(!channels.length)setTimeout(()=>{if(!channels.length){channels.push({id:uid(),name:'我的接口',type:'openai',base:BASE.openai,key:'',models:[]});save();openSet()}},300);
</script>
</body>
